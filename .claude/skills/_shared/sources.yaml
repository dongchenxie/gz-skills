# 政府政策官网源 —— 白名单。
# 所有 gzcots-* 生成类 skill 抓取/引用政策原文前必须先查这里。
#
# ───────── 使用规则（硬约束，违反 = 审核红线，阻塞发布） ─────────
#
# 1. 白名单原则：推文中引用的 URL、条款、数字、日期、机构名，**域名必须在本文件内**。
#    school_internal 域名仅供"指引指南"类（gzcots-guide）使用。
#
# 2. 域名校验：sub-agent 在抓取前必须用 URL parser 取 host，逐项匹配本文件 domain。
#    不匹配 → sub-agent 立即 abort 并把 URL 回报主上下文，**绝不**采纳为引用源。
#
# 3. 外网（清单外域名）：sub-agent 仅可用于背景理解（"业内如何解读"），
#    不允许出现在正文。具体数字 / 条款 / 期限 → 必须回到本清单内的官网核对。
#
# 4. 清单外发现高价值信源：sub-agent **不要私自采纳**，把候选 URL 放回主上下文，
#    由小编审核后手工加白到本文件，**不允许 skill 自动改 sources.yaml**。
#
# 5. 抓取优先级：直连 WebFetch → 失败 fallback Playwright MCP (`mcp__playwright__*`)。
#    每个站点的栏目入口路径见 category_path 字段；若该字段为空，sub-agent 从首页爬一层。
#
# 6. 三层并发（policy / tips 默认）：sub-agent 接到主题后并发抓 national + guangdong_province + 受众所在 city。
#    详见 `_shared/research-strategy.md`。
#
# ───────── 信源清单 ─────────

priority: high

national:
  - name: 住建部
    url: https://www.mohurd.gov.cn/
    category_path: ""     # unreachable on setup（ECONNREFUSED）；fallback 走首页爬一层（见 research-strategy.md）
  - name: 人社部
    url: https://www.mohrss.gov.cn/
    category_path: "/xxgk2020/"   # uncertain — setup 首页返回空，按官方信息公开主入口推断，首跑需人工复核
  - name: 中国建设工程标准化协会
    url: http://www.cecs.org.cn/index.html
    category_path: ""     # unreachable on setup（60s timeout）；fallback 走首页爬一层

guangdong_province:
