    category_path: "/bmpd/jmsrlzyhshbzj/zwgk/gggs/index.html"   # 政务公开/公告公示
  - name: 江门市住房和城乡建设局
    url: https://www.jiangmen.gov.cn/bmpd/jmszfhcxjsj/
    category_path: "/bmpd/jmszfhcxjsj/zwgk/gztg/index.html"     # 通知公告

yunfu_city:
  - name: 云浮市人力资源和社会保障局
    url: https://www.yunfu.gov.cn/rsj/index.html
    category_path: "/rsj/zx/tzgg/index.html"   # 通知公告
  - name: 云浮市住房和城乡建设局
