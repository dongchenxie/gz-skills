    url: https://zfcxjst.gd.gov.cn/
    category_path: "/xxgk/gsgg/index.html"   # 公示公告
  - name: 广东政务服务网
    url: https://www.gdzwfw.gov.cn/
    category_path: "/portal/v2/personal/hot"   # 个人办事热门入口；法人入口 fallback: /portal/v2/legal/hot
  - name: 广东人事考试网
    url: https://rsks.gd.gov.cn/
    category_path: "/zwgk/gzdt/index.html"    # 工作动态（考试机构发布首选）；fallback: /zwgk/tzgg/index.html

guangzhou_city:
