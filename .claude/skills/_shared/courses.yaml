# 课程话术弹药库。所有 gzcots-* 营销类 skill 写 CTA 时从这里取。
# 每门课分 B 端 / C 端两套话术。

categories:

  # ─── 注册类 ───
  jianzaoshi_yiji:
    name: 一级建造师
    target_c: 想求职 / 升职 / 提身价的工程人员（25-40 岁，技术员到项目经理）
    target_b: 建筑施工企业（一建数量直接挂钩资质升级）
    c_pitch: "考下一建≈月薪翻一倍 + 项目负责人门票"
    b_pitch: "企业资质三级升二级 / 二级升一级，一建注册数量是硬门槛"
    cta_c: "广建职校一建考前 + 继教一站式，4000-323-118"
    cta_b: "企业批量代培 / 挂证合规咨询，4000-323-118 转商务"

  jianzaoshi_erji:
    name: 二级建造师
    target_c: 想入门项目管理的施工人员
    target_b: 中小型建筑企业（二建是资质门槛）
    c_pitch: "二建是建筑业的'驾照'，没它做不了项目负责人"
    b_pitch: "企业资质保级 / 申报新资质，二建持证人数是硬指标"
    cta_c: "广建职校二建考前班 + 继教课程，4000-323-118"
    cta_b: "企业批量培训 + 资质人员配齐方案，4000-323-118 转商务"

  # ─── 施工现场 ───
  shisan_dayuan:
    name: 十三大员（施工员/质量员/安全员/标准员/材料员/机械员/劳务员/资料员等）
    target_c: 施工现场专业人员（蓝白领之间）
    target_b: 所有持有建筑业资质的施工企业（每个项目都要配齐）
    c_pitch: "持住建部认可电子证，全国通用，48 学时即可拿"
    b_pitch: "项目开工前人员配齐 + 资质年审刚需，集体报名优惠"
    cta_c: "广建职校线上 48 学时，扫尾部二维码报名"
    cta_b: "企业集体报名 50 人以上享团报价，4000-323-118 转商务"

  sanlei_renyuan:
    name: 三类人员 / 安管人员（A 证主要负责人 / B 证项目负责人 / C 证专职安全员）
    target_c: 企业关键岗位个人（必须持证上岗）
    target_b: 所有建筑施工企业（A/B/C 证是企业资质必备）
    c_pitch: "三类证是上岗硬门槛，过期不复训直接吊销资质"
    b_pitch: "三类人员到期复训 / 缺员补证一站式，避免企业被住建处罚"
    cta_c: "广建职校线上复训，3 天拿证，4000-323-118"
    cta_b: "企业 ABC 证统一管理 + 到期提醒服务，4000-323-118 转商务"

  jineng_gongren:
    name: 专业技术工人（砌筑工 / 钢筋工 / 抹灰工 / 木工 等）
    target_c: 一线施工工人
    target_b: 劳务公司、施工总包
    c_pitch: "拿技能等级证 + 申请政府技能补贴最高 XXXX 元（按工种 / 等级）"
    b_pitch: "工人持证率是资质审查重点，劳务公司刚需"
    cta_c: "广建职校代办报名 + 补贴申报指引，4000-323-118"
    cta_b: "劳务公司批量办证 + 用工合规咨询，4000-323-118 转商务"

  # ─── 继教 / 学时 ───
  jixu_jiaoyu:
    name: 专业技术人员继续教育
    target_c: 已持证的注册建造师、监理工程师、造价师等
    target_b: 持证人员所在企业（企业需保证员工继教完成）
    c_pitch: "学时不够证就废，每年都得续，别等到注销才补"
    b_pitch: "企业员工继教统一管理 + 学时台账，应付资质审查不慌"
    cta_c: "广建职校线上学时课，扫尾部二维码"
    cta_b: "企业团报 / 学时台账管理，4000-323-118 转商务"

  xueshi_bulu:
    name: 学时补录
    target_c: 已经错过本年继教窗口的持证人
    target_b: 企业批量员工漏学时的应急方案
    c_pitch: "学时漏了不用慌，我们有合规补录通道"
    b_pitch: "企业资质审查临近，员工继教漏了我们帮你统一补"
    cta_c: "电话咨询补录方案，4000-323-118"
    cta_b: "企业紧急补录方案，4000-323-118 转商务（限合规通道）"

  # ─── 职称 ───
  zhicheng:
    name: 职称评审（初级 / 中级 / 高级工程师）
    target_c: 想拿中高级职称的技术人员
    target_b: 企业（高级工程师人数挂钩资质 / 招投标加分）
    c_pitch: "中级工程师月薪上限直接拉高，评不上等于自费降薪"
    b_pitch: "企业招投标 / 资质申报，高级工程师人数是硬加分"
    cta_c: "广建职校职称代办 + 论文指导，4000-323-118"
    cta_b: "企业职称批量评审方案，4000-323-118 转商务"

  # ─── 企业资质 ───
  qiye_zizhi:
    name: 建筑企业资质申报 / 升级 / 延续
    target_c: （不适用）
    target_b: 所有建筑施工企业
    b_pitch: "资质 = 投标门票。人员凑不齐 = 错过一年订单"
    cta_b: "广建职校一站式资质方案：人员培训 + 证书凑齐 + 申报代办，4000-323-118 转商务"

# 通用 CTA 元素
cta_elements:
  urgency_high: "最高补贴，不要错过"
  urgency_mid: "名额有限，先报先学"
  trust: "建校 1988，广州市教育局直属"
  b_handoff: "贵司有批量培训需求？致电 4000-323-118 转商务，10 分钟出方案"
