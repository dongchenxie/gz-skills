  footer_image_url: "https://mmecoa.qpic.cn/mmecoa_jpg/0PdgjwEvWC5wgibhXdGIySKTURw4lUMZYgS3ibLiaGL8PJ2NbOSYcWRD78R6oicS8sEueYjum0aQub9Fibm0icdY6DfpVzK8FX6qlvkmyuM5Wicgjs/640?wx_fmt=jpeg&from=appmsg&tp=webp&wxfrom=10005&wx_lazy=1"

# 视觉规范 (135 编辑器 / 微信公众号渲染口径)
visual:
  font_stack: "'Microsoft YaHei', 'PingFang SC', sans-serif"
  body_font_size: 16px
  body_line_height: 1.75
  body_color: "#333333"
  brand_primary: "#1a4b8c"   # 工程蓝（占位，确认后改）
  brand_accent: "#d9534f"    # 紧迫感红 (用于 CTA / "最高补贴")
  highlight_bg: "#f5f9ff"
  border_color: "#1a4b8c"

# 输出口径
editor:
  target: 135editor   # 影响 HTML 写法：必须全部 inline style，section 嵌套，不使用 script/style/link
  paste_target: WeChat MP   # 最终粘到微信公众号原生编辑器之前先过 135

# 客户画像（强制前置选择，决定话术）
audience:
  primary: B端建筑施工企业
  primary_reason: 一单成交金额高，资质 / 合规 / 批量培训是长期需求
  secondary: C端个人（持证 / 考证 / 工人 / 申报补贴）
  cross_sell: 所有 C 端推文末尾必须留 B 端引流 CTA（"贵司有批量培训需求？"）
